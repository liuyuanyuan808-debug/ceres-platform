<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f3">
  <title>Breast Pump Control</title>
  <link rel="icon" href="assets/mode-stimulation.png">
  <link rel="stylesheet" href="styles.css?v=20261119-1004">
  <link rel="stylesheet" href="embed.css?v=20261119-1004">
</head>
<body>
  <nav id="demo-controls" aria-label="原型效果演示">
    <section class="demo-group fault-demo-group">
      <h2>7.2.1 异常样例</h2>
      <div class="demo-fault-buttons">
        <button id="demo-event" class="demo-circle" aria-label="E53 事件提醒"><span>E53</span><span>事件提醒</span></button>
        <button id="demo-blocking" class="demo-circle" aria-label="E05 阻断弹窗"><span>E05</span><span>阻断弹窗</span></button>
      </div>
      <button id="demo-recover" class="demo-scenario">设备确认恢复</button>
      <p class="demo-note">左侧 E05 · 右侧 E53<br>E53 为跨型号组件样例</p>
    </section>
    <section class="demo-group submission-demo-group">
      <h2>7.2.2 问题提交</h2>
      <div class="demo-scenarios" aria-label="问题提交的四个功能点">
        <button class="demo-scenario" data-submission-group="validation" aria-pressed="false">1. 入口与提交校验</button>
        <button class="demo-scenario" data-submission-group="submitting" aria-pressed="false">2. 提交中与防重复</button>
        <button class="demo-scenario" data-submission-group="result" aria-pressed="false">3. 提交结果与手动重试</button>
        <button class="demo-scenario" data-submission-group="recovery" aria-pressed="false">4. 页面返回与中断恢复</button>
      </div>
      <div id="demo-context" hidden>
        <label id="demo-case-label" for="demo-case">演示情境</label>
        <select id="demo-case" aria-describedby="demo-context-hint"></select>
        <p id="demo-context-hint" class="demo-note"></p>
      </div>
      <p id="demo-task-status" class="demo-note" role="status"></p>
      <button class="demo-scenario" data-scenario="reset">重置演示</button>
      <p class="demo-note">本地模拟任务，未上传真实日志</p>
    </section>
  </nav>
  <main id="phone" aria-label="Breast pump app prototype">
    <div id="status-bar" aria-hidden="true">
      <span class="status-time">17:42</span><svg class="location" viewBox="0 0 16 16"><path d="M14 2 9 14 7 9 2 7Z"/></svg>
      <div class="status-right"><svg class="wifi" viewBox="0 0 24 18"><path d="M2 5a17 17 0 0 1 20 0M6 9a11 11 0 0 1 12 0M10 13a4 4 0 0 1 4 0"/><circle cx="12" cy="16" r="1.1"/></svg><span class="system-battery"></span></div>
    </div>
    <div id="warm-tip-glow" aria-hidden="true" hidden></div>
    <header id="navigation">
      <button id="back" class="glass-circle" aria-label="Back"></button>
      <h1 id="page-title">Breast Pump Control</h1>
      <button id="settings" class="glass-circle" aria-label="Manage devices"></button>
    </header>
    <aside id="warm-tip" role="status" hidden>
      <p><span>“ Looks like let-down has started. I’ll switch to</span><span>Expression mode for you now. ”</span></p>
    </aside>
    <div id="page-content"></div>
    <div id="pumping-actions"></div>
    <div id="modal-layer"></div>
    <div id="success-layer" hidden></div>
    <div class="home-indicator" aria-hidden="true"></div>
    <aside id="event-reminder" aria-labelledby="event-reminder-title" hidden>
      <button id="event-reminder-toggle" aria-expanded="true" aria-controls="event-reminder-description">
        <span class="event-symbol" aria-hidden="true">!</span>
        <span id="event-reminder-title">右侧 · 未检测到法兰</span>
        <svg class="event-chevron" viewBox="0 0 12 10" aria-hidden="true"><path d="m2 7 4-4 4 4"/></svg>
      </button>
      <p id="event-reminder-description" role="status">未检测到法兰，暂不可加热，请重新安装并卡紧</p>
      <button id="dismiss-event" aria-label="Close event reminder"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="m3 3 8 8m0-8-8 8"/></svg></button>
    </aside>
    <div id="event-blocker" hidden>
      <section class="blocking-card" role="alertdialog" aria-modal="true" aria-labelledby="blocking-title" aria-describedby="blocking-description">
        <h2 id="blocking-title">左侧 · 电池温度过高</h2>
        <p id="blocking-description">电池温度过高，设备暂停使用</p>
        <button id="confirm-blocking">我知道了</button>
      </section>
    </div>
    <div id="issue-toast" role="status" hidden></div>
  </main>
  <script src="review-data.js?v=20261119-1004"></script>
  <script src="issue-model.js?v=20261119-1004"></script>
  <script src="app.js?v=20261119-1004"></script>
</body>
</html>
